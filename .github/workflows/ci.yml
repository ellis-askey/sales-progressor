# CI safety net (audit full-audit-2026-10, finding PROC-001).
#
# Laws 2 and 18 claim an automated gate between a code change and production;
# until this file, none existed. This runs the two checks that already exist
# and already pass locally, on every push and PR:
#
#   1. tsc --noEmit        - the Law 2 typecheck
#   2. jest (full suite)   - includes the Law 7 access-scope coverage test
#                            and the tenant-isolation suites
#
# Playwright e2e and visual regression need a running app + database and are
# NOT wired here yet - tracked as the next CI increment in the audit's fix plan.

name: CI

on:
  push:
    branches: [master, staging]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci --silent
