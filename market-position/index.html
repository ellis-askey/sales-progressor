<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MARKET POSITION — TSP competitive intelligence</title>
<style>
/* ============================ Design tokens ============================ */
:root{
  --coral:#FF6B4A; --coral-2:#FF8A65; --coral-deep:#E55B3D;
  --vendor:#6366F1; --purchaser:#EC4899;
  --ok:#2FAE6A; --warn:#E0A33A; --bad:#E05656; --info:#4C8DD6; --violet:#9B6BE0;
  --radius:14px; --radius-sm:10px; --radius-lg:22px;
  --ease:cubic-bezier(.4,0,.2,1);
  --fs-eyebrow:10px; --tr:.18s var(--ease);
  --maxw:1500px;
}
:root[data-theme="dark"]{
  --bg:#0b0d10; --bg-2:#0e1116; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.065);
  --panel-solid:#14181f; --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.065);
  --text:#eef1f5; --text-2:rgba(238,241,245,.68); --text-3:rgba(238,241,245,.42);
  --glass-blur:22px; --shadow:0 10px 40px rgba(0,0,0,.45); --cell-bg:rgba(255,255,255,.03);
  --grad:radial-gradient(1200px 600px at 78% -10%,rgba(255,107,74,.14),transparent 60%),radial-gradient(900px 500px at 5% 5%,rgba(99,102,241,.10),transparent 55%);
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --bg-2:#eef1f6; --panel:rgba(255,255,255,.72); --panel-2:rgba(255,255,255,.9);
  --panel-solid:#ffffff; --hair:rgba(20,30,45,.12); --hair-2:rgba(20,30,45,.07);
  --text:#15202b; --text-2:rgba(21,32,43,.66); --text-3:rgba(21,32,43,.42);
  --glass-blur:18px; --shadow:0 10px 36px rgba(20,30,45,.12); --cell-bg:rgba(20,30,45,.025);
  --grad:radial-gradient(1200px 600px at 80% -12%,rgba(255,107,74,.12),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(99,102,241,.08),transparent 55%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:var(--grad); background-attachment:fixed;
}
a{color:var(--coral-2); text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
.eyebrow{font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:.14em; color:var(--text-3); font-weight:600}
.muted{color:var(--text-2)} .dim{color:var(--text-3)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit; cursor:pointer; color:inherit; background:none; border:none}
::selection{background:rgba(255,107,74,.3)}

/* ============================ Layout ============================ */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:18px;
  padding:14px 22px; background:var(--panel); backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%); border-bottom:1px solid var(--hair);
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--coral),var(--coral-deep));
  display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto;box-shadow:0 4px 14px rgba(255,107,74,.4)}
.brand-txt h1{font-size:15px;letter-spacing:.04em}
.brand-txt .sub{font-size:11px;color:var(--text-3)}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--hair);
  background:var(--panel-2);font-size:12px;color:var(--text-2);transition:var(--tr);white-space:nowrap}
.chip b{color:var(--text)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:var(--panel-2);
  display:grid;place-items:center;transition:var(--tr)}
.icon-btn:hover{border-color:var(--coral);color:var(--coral-2)}
.freshdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.f-FRESH{background:var(--ok)} .f-REVIEW_SOON{background:var(--warn)} .f-STALE{background:var(--bad)}

.tabs{position:sticky;top:63px;z-index:30;display:flex;gap:2px;padding:8px 18px;overflow-x:auto;
  background:var(--panel);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  border-bottom:1px solid var(--hair);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:var(--tr)}
.tab:hover{color:var(--text);background:var(--panel-2)}
.tab.active{color:var(--coral-2);background:var(--cell-bg)}
.tab.active{box-shadow:inset 0 -2px 0 var(--coral)}

main{max-width:var(--maxw);margin:0 auto;padding:26px 22px 90px}
.view{animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{margin-bottom:22px}
.page-head h2{font-size:23px;margin-bottom:5px}
.page-head p{color:var(--text-2);font-size:14px;max-width:70ch;margin:0}

.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g-2,.g-3{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius);padding:18px;
  backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));transition:var(--tr)}
.card.interactive{cursor:pointer}
.card.interactive:hover{border-color:var(--coral);transform:translateY(-2px);box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:8px}
.card .k{font-size:28px;font-weight:700;letter-spacing:-.02em}

.pillrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--hair);background:var(--cell-bg);color:var(--text-2);font-weight:500}
.tag.type-DIRECT{color:#ff9a7d;border-color:rgba(255,107,74,.4)}
.tag.type-PARTIAL{color:#9fb4e6;border-color:rgba(99,102,241,.35)}
.tag.type-ADJACENT{color:#c7a3ea;border-color:rgba(155,107,224,.35)}
.tag.type-SERVICE{color:#7fd3a6;border-color:rgba(47,174,106,.35)}
.tag.type-TSP{color:#fff;background:linear-gradient(145deg,var(--coral),var(--coral-deep));border-color:transparent}

/* status + knowledge badges */
.sb{font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.sb.LIVE{background:rgba(47,174,106,.16);color:#48c98a}
.sb.PARTIAL{background:rgba(224,163,58,.16);color:#e7b85c}
.sb.DEVELOPMENT{background:rgba(76,141,214,.16);color:#6ba6e0}
.sb.PLANNED{background:rgba(255,255,255,.08);color:var(--text-3)}
.kb{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.kb.PUBLIC{background:rgba(47,174,106,.14);color:#4cbd83}
.kb.INTERNAL{background:rgba(224,163,58,.16);color:#e7b85c}
.kb.INFERENCE{background:rgba(255,255,255,.07);color:var(--text-3)}
.cf{font-size:10px;font-weight:600;color:var(--text-3)}
.cf.CONFIRMED{color:#4cbd83} .cf.LIKELY{color:#e7b85c} .cf.UNCLEAR{color:var(--text-3)}

/* ============================ Depth cells ============================ */
.depth{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 7px;
  border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border:1px solid transparent}
.d-ADVANCED{background:linear-gradient(145deg,var(--coral),var(--coral-deep));color:#fff}
.d-STRONG{background:rgba(255,107,74,.2);color:#ff9a7d;border-color:rgba(255,107,74,.4)}
.d-BASIC{background:rgba(224,163,58,.16);color:#e7b85c;border-color:rgba(224,163,58,.3)}
.d-PRESENT{background:rgba(76,141,214,.16);color:#6ba6e0;border-color:rgba(76,141,214,.3)}
.d-NONE{background:transparent;color:var(--bad);border-color:rgba(224,86,86,.3)}
.d-UNKNOWN{background:transparent;color:var(--text-3);border:1px dashed var(--hair)}

/* ============================ Matrix ============================ */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{background:var(--panel-2);border:1px solid var(--hair);color:var(--text);
  border-radius:9px;padding:8px 11px;font-size:13px;transition:var(--tr)}
.toolbar select:focus,.toolbar input:focus{outline:none;border-color:var(--coral)}
.colchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.colchip{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--hair);background:var(--cell-bg);
  color:var(--text-2);transition:var(--tr);user-select:none}
.colchip.on{border-color:var(--coral);color:var(--coral-2);background:rgba(255,107,74,.08)}
.colchip.tsp{border-color:var(--coral);background:linear-gradient(145deg,var(--coral),var(--coral-deep));color:#fff;cursor:default}

.matrix-wrap{overflow:auto;border:1px solid var(--hair);border-radius:var(--radius);background:var(--panel);max-height:72vh}
table.matrix{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.matrix th,table.matrix td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--hair-2);white-space:nowrap}
table.matrix thead th{position:sticky;top:0;z-index:3;background:var(--panel-solid);font-size:11px;font-weight:600;
  border-bottom:1px solid var(--hair)}
table.matrix thead th.ent{text-align:center;min-width:92px;cursor:default}
table.matrix .cat-row td{position:sticky;left:0;background:var(--bg-2);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);z-index:2}
table.matrix td.cap,table.matrix th.cap{position:sticky;left:0;z-index:2;background:var(--panel-solid);
  min-width:230px;max-width:280px;white-space:normal;font-weight:500;border-right:1px solid var(--hair)}
table.matrix thead th.cap{z-index:4}
table.matrix td.cell{text-align:center;cursor:pointer;transition:background .15s}
table.matrix td.cell:hover{background:var(--cell-bg)}
table.matrix tbody tr:hover td.cap{background:var(--panel-2)}
.entcol-tsp{color:var(--coral-2)!important}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ============================ Drawer ============================ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,94vw);background:var(--panel-solid);
  border-left:1px solid var(--hair);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .3s var(--ease);
  z-index:51;overflow-y:auto;padding:22px}
.drawer.open{transform:none}
.drawer-close{position:absolute;top:16px;right:16px}
.drawer h3{font-size:18px;padding-right:40px;margin-bottom:4px}
.drawer .section{margin-top:18px}
.drawer .section .eyebrow{margin-bottom:7px;display:block}
.ev{border-left:2px solid var(--hair);padding:6px 0 6px 12px;margin:8px 0;font-size:12.5px}
.ev a{word-break:break-all}
.note{background:var(--cell-bg);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12.5px}
.note .meta{display:flex;gap:8px;align-items:center;margin-bottom:5px}
textarea,.drawer select{width:100%;background:var(--panel-2);border:1px solid var(--hair);color:var(--text);
  border-radius:9px;padding:9px;font:inherit;font-size:13px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  background:linear-gradient(145deg,var(--coral),var(--coral-deep));color:#fff;transition:var(--tr)}
.btn:hover{filter:brightness(1.08)} .btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--hair)}

/* overview specials */
.sig{border-left:3px solid var(--hair);padding-left:12px;margin:10px 0}
.sig.dist{border-color:var(--coral)} .sig.strong{border-color:var(--coral-2)} .sig.parity{border-color:var(--text-3)}
.sig.gap{border-color:var(--bad)} .sig.watch{border-color:var(--warn)} .sig.road{border-color:var(--info)}
.sig h4{font-size:13.5px} .sig p{font-size:12.5px;color:var(--text-2);margin:3px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.timeline .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair-2)}
.timeline .date{font-size:11.5px;color:var(--text-3);min-width:92px;flex:0 0 auto}
.bar{height:6px;border-radius:3px;background:var(--cell-bg);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--coral-2))}
details.acc{border:1px solid var(--hair);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--panel)}
details.acc summary{padding:13px 16px;cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{border-bottom:1px solid var(--hair)}
details.acc .body{padding:14px 16px}
.row-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hair-2);font-size:13px}
.row-item:last-child{border-bottom:none}
.empty{text-align:center;color:var(--text-3);padding:40px;font-size:13px}
.loader{text-align:center;color:var(--text-3);padding:70px;font-size:14px}
table.simple{width:100%;border-collapse:collapse;font-size:12.5px}
table.simple th,table.simple td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--hair-2);vertical-align:top}
table.simple th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600}
.table-scroll{overflow-x:auto;border:1px solid var(--hair);border-radius:var(--radius);background:var(--panel)}
.footer-note{margin-top:30px;padding-top:16px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--text-3);max-width:80ch}
</style>
</head>
<body>
<div id="app"><div class="loader">Loading…</div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail"></aside>

<script src="data/market-data.js"></script>
<script>
"use strict";
(function(){
const D = window.MARKET_POSITION_DATA;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = (arr,id)=>arr.find(x=>x.id===id);

if(!D){ $('#app').innerHTML='<div class="empty">Could not load data/market-data.js. Open this file over a local server if your browser blocks local scripts.</div>'; return; }

/* ---- lookups ---- */
const CAP = Object.fromEntries(D.capabilities.map(c=>[c.id,c]));
const CAT = Object.fromEntries(D.categories.map(c=>[c.id,c]));
const ENT = Object.fromEntries(D.entities.map(e=>[e.id,e]));
const ASSESS = {}; // entityId -> capId -> assessment
D.assessments.forEach(a=>{ (ASSESS[a.entityId]=ASSESS[a.entityId]||{})[a.capabilityId]=a; });
const PRICE = Object.fromEntries(D.pricing.map(p=>[p.entityId,p]));
const competitors = D.entities.filter(e=>e.type!=='TSP');
const tsp = byId(D.entities,'tsp');
const catsSorted = [...D.categories].sort((a,b)=>a.order-b.order);

const DEPTH = {
  ADVANCED:{abbr:'ADV',label:'Advanced — unusually deep'},
  STRONG:{abbr:'STR',label:'Strong — clearly built out'},
  PRESENT:{abbr:'PRS',label:'Present — depth not established'},
  BASIC:{abbr:'BAS',label:'Basic — present but shallow'},
  NONE:{abbr:'NO',label:'None — evidence of absence'},
  UNKNOWN:{abbr:'?',label:'Unknown — not established'},
};
const depthCell = d => `<span class="depth d-${d}">${DEPTH[d]?DEPTH[d].abbr:'?'}</span>`;

/* ---- freshness ---- */
const TODAY = new Date();
function freshness(dateStr){
  if(!dateStr) return 'STALE';
  const days = (TODAY - new Date(dateStr))/(864e5);
  if(days <= D.meta.freshnessWindows.freshDays) return 'FRESH';
  if(days <= D.meta.freshnessWindows.reviewSoonDays) return 'REVIEW_SOON';
  return 'STALE';
}

/* ---- user notes (localStorage) ---- */
const LS='mp_notes_v1';
function loadNotes(){ try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]} }
function saveNotes(n){ localStorage.setItem(LS,JSON.stringify(n)); }
function notesFor(type,id){
  const seed=(D.userNotesSeed||[]).filter(n=>n.targetType===type&&n.targetId===id);
  const user=loadNotes().filter(n=>n.targetType===type&&n.targetId===id);
  return seed.concat(user);
}

/* ======================= shell ======================= */
const TABS=[
  ['overview','Overview'],['matrix','Matrix'],['competitors','Competitors'],['tsp','TSP Position'],
  ['gaps','Gaps & Opportunities'],['moats','Moats'],['pricing','Pricing'],['changes','Market Changes'],['sources','Sources']
];
let current='overview';
const latestRun = D.researchRuns[D.researchRuns.length-1];

function shell(){
  const fr = freshness(latestRun.date);
  $('#app').innerHTML = `
  <header class="topbar">
    <div class="brand">
      <div class="logo">M</div>
      <div class="brand-txt"><h1>MARKET POSITION</h1><div class="sub">${esc(D.meta.subtitle)}</div></div>
    </div>
    <div class="spacer"></div>
    <span class="chip" title="Latest research run"><span class="freshdot f-${fr}"></span> ${esc(latestRun.label)} · <b>${esc(latestRun.date)}</b></span>
    <span class="chip" title="Entities compared"><b>${competitors.length}</b> competitors</span>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>
  <nav class="tabs" id="tabs">${TABS.map(t=>`<button class="tab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav>
  <main id="view"></main>`;
  $('#themeBtn').onclick=toggleTheme;
  $('#tabs').onclick=e=>{ const b=e.target.closest('.tab'); if(b){ go(b.dataset.tab); } };
  go(current);
}
function go(tab){
  current=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  const v=$('#view'); v.innerHTML=`<div class="view">${RENDER[tab]()}</div>`;
  if(AFTER[tab]) AFTER[tab]();
  window.scrollTo(0,0);
}
function toggleTheme(){
  const r=document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark'?'light':'dark');
  try{localStorage.setItem('mp_theme',r.getAttribute('data-theme'))}catch(e){}
}
(function initTheme(){ try{const t=localStorage.getItem('mp_theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){} })();

/* ======================= drawer ======================= */
function openDrawer(html){ $('#drawer').innerHTML=`<button class="icon-btn drawer-close" onclick="window.__close()">✕</button>`+html; $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); }
window.__close=()=>{ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); };
$('#scrim').onclick=window.__close;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') window.__close(); });

/* ======================= OVERVIEW ======================= */
function statCounts(){
  let adv=0,strong=0,none=0,unk=0,gapN=0;
  D.capabilities.forEach(c=>{
    const a=(ASSESS.tsp||{})[c.id];
    if(a&&a.tspStatus==='LIVE'&&(a.depth==='ADVANCED'))adv++;
    if(a&&a.tspStatus==='LIVE'&&(a.depth==='ADVANCED'||a.depth==='STRONG'))strong++;
    if(a&&(a.depth==='NONE'))none++;
  });
  return {adv,strong,none};
}
const RENDER={}, AFTER={};
RENDER.overview=()=>{
  const o=D.overview, s=statCounts();
  const liveAdvanced = D.capabilities.filter(c=>{const a=(ASSESS.tsp||{})[c.id];return a&&a.tspStatus==='LIVE'&&a.depth==='ADVANCED';}).length;
  const forward = D.capabilities.filter(c=>{const a=(ASSESS.tsp||{})[c.id];return a&&(a.tspStatus==='DEVELOPMENT'||a.tspStatus==='PLANNED'||a.tspStatus==='PARTIAL');}).length;
  const sig=(arr,cls)=>arr.map(x=>`<div class="sig ${cls}">
      <h4>${esc(x.title)} ${x.capabilityId?linkCapBtn(x.capabilityId):''}</h4>
      ${x.note?`<p>${esc(x.note)}</p>`:''}</div>`).join('');
  return `
  <div class="page-head"><h2>Where TSP sits, at a glance</h2>
    <p>Baseline snapshot, ${esc(latestRun.date)}. Only capabilities that are genuinely <b>live</b> count toward TSP's current position; planned and in-development work is shown separately as forward position. ${esc(D.meta.disclaimer)}</p></div>
  <div class="kpis">

    <div class="card"><div class="eyebrow">Current gaps</div><div class="k">${o.gaps.length}</div><div class="muted" style="font-size:12px">capabilities TSP lacks today</div></div>
    <div class="card"><div class="eyebrow">Competitors tracked</div><div class="k">${competitors.length}</div><div class="muted" style="font-size:12px">direct · partial · adjacent · service</div></div>
  </div>
  <div class="grid g-2">
    <div class="card"><h3 style="color:var(--coral-2)">Distinctive — little/no comparable found</h3>${sig(o.distinctive,'dist')}</div>
    <div class="card"><h3>Strong positions</h3>${sig(o.strongPositions,'strong')}</div>
    <div class="card"><h3 style="color:var(--bad)">Current gaps</h3>${sig(o.gaps,'gap')}</div>
    <div class="card"><h3 style="color:var(--warn)">Watch list</h3>${sig(o.watchList,'watch')}</div>
    <div class="card"><h3 style="color:var(--text-3)">Parity / table stakes</h3>${sig(o.parity,'parity')}</div>

  </div>
  <p class="footer-note">Read the Matrix for the cell-by-cell evidence, Competitors for profiles, and Gaps for the strategic read on what matters. Every claim links to a dated source under Sources.</p>`;
};
function linkCapBtn(capId){ return `<button class="tag" style="cursor:pointer" onclick="window.__cap('${capId}')">matrix ↗</button>`; }
window.__cap=(capId)=>{ go('matrix'); setTimeout(()=>{ const el=document.querySelector('[data-caprow="'+capId+'"]'); if(el){el.scrollIntoView({block:'center'}); el.style.outline='2px solid var(--coral)'; setTimeout(()=>el.style.outline='',1600);} },60); };

/* ======================= MATRIX ======================= */
const matrixState={ cat:'all', type:'all', status:'all', search:'', cols:new Set(['mio','vmc','street','alto','reapit']) };
RENDER.matrix=()=>{
  return `
  <div class="page-head"><h2>Competitive matrix</h2>
    <p>Capabilities down, products across. Cells are depth judgements from dated evidence — click any cell for the evidence. Pick which competitors to show; TSP is always pinned first.</p></div>
  <div class="toolbar">
    <select id="mCat"><option value="all">All categories</option>${catsSorted.map(c=>`<option value="${c.id}">${esc(c.label)}</option>`).join('')}</select>
    <select id="mStatus"><option value="all">Any TSP status</option><option>LIVE</option><option>PARTIAL</option><option>DEVELOPMENT</option><option>PLANNED</option></select>
    <input id="mSearch" placeholder="Search capabilities…" style="flex:1;min-width:150px" />
    <label class="chip"><input type="checkbox" id="mHide" style="margin-right:6px"/>Hide rows unknown for all shown</label>
  </div>
  <div class="colchips" id="mCols">
    <span class="colchip tsp">TSP (pinned)</span>
    ${competitors.map(c=>`<button class="colchip ${matrixState.cols.has(c.id)?'on':''}" data-col="${c.id}">${esc(c.name)} <span class="dim">· ${c.type.toLowerCase()}</span></button>`).join('')}
  </div>
  <div class="matrix-wrap" id="mWrap"></div>
  <div class="legend">
    <span>${depthCell('ADVANCED')} Advanced</span><span>${depthCell('STRONG')} Strong</span>
    <span>${depthCell('PRESENT')} Present (depth unclear)</span><span>${depthCell('BASIC')} Basic</span>
    <span>${depthCell('NONE')} None (evidence of absence)</span><span>${depthCell('UNKNOWN')} Unknown / not assessed</span>
  </div>
  <p class="footer-note"><b>Unknown ≠ None.</b> A dashed “?” means we found no evidence either way (treat as not established). A red “NO” means we found reasonable evidence the capability is absent. Empty competitor cells are unassessed and render as Unknown.</p>`;
};
AFTER.matrix=()=>{
  $('#mCat').value=matrixState.cat; $('#mStatus').value=matrixState.status; $('#mSearch').value=matrixState.search;
  $('#mHide').checked=matrixState.hideUnknown||false;
  $('#mCat').onchange=e=>{matrixState.cat=e.target.value;drawMatrix();};
  $('#mStatus').onchange=e=>{matrixState.status=e.target.value;drawMatrix();};
  $('#mSearch').oninput=e=>{matrixState.search=e.target.value.toLowerCase();drawMatrix();};
  $('#mHide').onchange=e=>{matrixState.hideUnknown=e.target.checked;drawMatrix();};
  $('#mCols').onclick=e=>{const b=e.target.closest('[data-col]'); if(!b)return; const id=b.dataset.col;
    matrixState.cols.has(id)?matrixState.cols.delete(id):matrixState.cols.add(id); b.classList.toggle('on'); drawMatrix();};
  drawMatrix();
};
function drawMatrix(){
  const cols=['tsp',...competitors.filter(c=>matrixState.cols.has(c.id)).map(c=>c.id)];
  const cats = matrixState.cat==='all'?catsSorted:catsSorted.filter(c=>c.id===matrixState.cat);
  let html=`<table class="matrix"><thead><tr><th class="cap">Capability</th>${cols.map(id=>`<th class="ent ${id==='tsp'?'entcol-tsp':''}">${esc(ENT[id].name.split(' / ')[0])}</th>`).join('')}</tr></thead><tbody>`;
  let rows=0;
  cats.forEach(cat=>{
    const caps=D.capabilities.filter(c=>c.categoryId===cat.id)
      .filter(c=>!matrixState.search || c.label.toLowerCase().includes(matrixState.search) || (c.description||'').toLowerCase().includes(matrixState.search))
      .filter(c=>{ if(matrixState.status==='all')return true; const a=(ASSESS.tsp||{})[c.id]; return a&&a.tspStatus===matrixState.status; })
      .filter(c=>{ if(!matrixState.hideUnknown)return true; return cols.some(id=>{const a=(ASSESS[id]||{})[c.id]; return a && a.depth!=='UNKNOWN';}); });
    if(!caps.length)return;
    html+=`<tr class="cat-row"><td colspan="${cols.length+1}">${esc(cat.label)}</td></tr>`;
    caps.forEach(c=>{
      rows++;
      html+=`<tr data-caprow="${c.id}"><td class="cap">${esc(c.label)}</td>`;
      cols.forEach(id=>{
        const a=(ASSESS[id]||{})[c.id];
        const d=a?a.depth:'UNKNOWN';
        const extra = (id==='tsp'&&a&&a.tspStatus&&a.tspStatus!=='LIVE')?`<span class="sb ${a.tspStatus}" style="margin-left:4px;font-size:8px;padding:1px 4px">${a.tspStatus[0]}</span>`:'';
        html+=`<td class="cell" data-cap="${c.id}" data-ent="${id}">${depthCell(d)}${extra}</td>`;
      });
      html+=`</tr>`;
    });
  });
  html+=`</tbody></table>`;
  if(!rows) html=`<div class="empty">No capabilities match these filters.</div>`;
  const wrap=$('#mWrap'); wrap.innerHTML=html;
  wrap.onclick=e=>{const td=e.target.closest('.cell'); if(td) cellDrawer(td.dataset.ent,td.dataset.cap);};
}
function cellDrawer(entId,capId){
  window.__lastCell={entId,capId};
  const e=ENT[entId], c=CAP[capId], a=(ASSESS[entId]||{})[capId];
  const d=a?a.depth:'UNKNOWN';
  const ev=(a&&a.evidence&&a.evidence.length)?a.evidence.map(x=>`<div class="ev">${x.note?`<b>${esc(x.note)}</b><br>`:''}${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>`:''}${x.dateChecked?`<div class="dim" style="font-size:11px;margin-top:2px">checked ${esc(x.dateChecked)}</div>`:''}</div>`).join(''):'<div class="dim" style="font-size:12.5px">No evidence captured — treat as not established.</div>';
  openDrawer(`
    <div class="eyebrow">${esc(e.name)} ${e.type!=='TSP'?`· ${e.type.toLowerCase()}`:''}</div>
    <h3>${esc(c.label)}</h3>
    <div class="pillrow">
      <span class="depth d-${d}">${DEPTH[d]?DEPTH[d].label:d}</span>
      ${a&&a.confidence?`<span class="cf ${a.confidence}">${a.confidence}</span>`:''}
      ${a&&a.knowledgeType?`<span class="kb ${a.knowledgeType}">${a.knowledgeType}</span>`:''}
      ${entId==='tsp'&&a&&a.tspStatus?`<span class="sb ${a.tspStatus}">${a.tspStatus}</span>`:''}
    </div>
    <div class="section"><span class="eyebrow">What this means</span><p class="muted" style="font-size:13px">${esc(c.description)}</p></div>
    <div class="section"><span class="eyebrow">Assessment</span><p style="font-size:13.5px">${a?esc(a.summary):'Not assessed in this run. Shown as Unknown — no evidence either way.'}</p></div>
    <div class="section"><span class="eyebrow">Evidence</span>${ev}</div>
    ${notesBlock('capability',capId)}
  `);
}

/* ======================= COMPETITORS ======================= */

window.__ent=(id)=>{

  const strengths=D.capabilities.filter(c=>{const a=(ASSESS[id]||{})[c.id];return a&&(a.depth==='ADVANCED'||a.depth==='STRONG');});

  openDrawer(`

    ${e.notEvidenced&&e.notEvidenced.length?`<div class="section"><span class="eyebrow">Not evidenced</span><p class="muted" style="font-size:12.5px">${e.notEvidenced.map(esc).join(' · ')}</p></div>`:''}
    ${strengths.length?`<div class="section"><span class="eyebrow">Assessed strengths (this run)</span><div class="pillrow">${strengths.map(c=>`<span class="tag">${esc(c.label)}</span>`).join('')}</div></div>`:''}
    ${absent.length?`<div class="section"><span class="eyebrow">Evidenced absent</span><div class="pillrow">${absent.map(c=>`<span class="tag" style="color:var(--bad)">${esc(c.label)}</span>`).join('')}</div></div>`:''}
    ${p?`<div class="section"><span class="eyebrow">Commercial model</span><div class="note"><b>${esc(p.model)}</b><br>${esc(p.perTransaction&&p.perTransaction!=='No'?p.perTransaction:(p.managedPrice||''))}<br><span class="dim">Trigger: ${esc(p.chargingTrigger)} · confidence ${esc(p.confidence)}</span></div></div>`:''}
    ${e.recentChanges&&e.recentChanges.length?`<div class="section"><span class="eyebrow">Recent changes</span>${e.recentChanges.map(s=>`<div class="row-item">• ${esc(s)}</div>`).join('')}</div>`:''}
    <div class="section"><span class="eyebrow">Sources · last checked ${esc(e.lastChecked)}</span>${(e.sources||[]).map(s=>`<div class="ev"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a><div class="dim" style="font-size:11px">${esc(s.url)}</div></div>`).join('')}</div>
    ${notesBlock('entity',id)}
  `);
};

/* ======================= TSP POSITION ======================= */
RENDER.tsp=()=>{
  let cur='',fwd='';
  catsSorted.forEach(cat=>{
    const caps=D.capabilities.filter(c=>c.categoryId===cat.id);
    const live=caps.filter(c=>{const a=(ASSESS.tsp||{})[c.id];return a&&a.tspStatus==='LIVE'&&a.depth!=='NONE';});
    const forward=caps.filter(c=>{const a=(ASSESS.tsp||{})[c.id];return a&&(a.tspStatus==='DEVELOPMENT'||a.tspStatus==='PLANNED'||a.tspStatus==='PARTIAL');});
    if(live.length) cur+=`<details class="acc"><summary>${esc(cat.label)}<span class="dim" style="font-weight:400">${live.length} live</span></summary><div class="body">${live.map(c=>{const a=ASSESS.tsp[c.id];return `<div class="row-item"><span class="depth d-${a.depth}">${DEPTH[a.depth].abbr}</span><div><b>${esc(c.label)}</b><div class="muted" style="font-size:12.5px">${esc(a.summary)}</div></div></div>`;}).join('')}</div></details>`;
    if(forward.length) fwd+=`<details class="acc"><summary>${esc(cat.label)}<span class="dim" style="font-weight:400">${forward.length}</span></summary><div class="body">${forward.map(c=>{const a=ASSESS.tsp[c.id];return `<div class="row-item"><span class="sb ${a.tspStatus}">${a.tspStatus}</span><div><b>${esc(c.label)}</b><div class="muted" style="font-size:12.5px">${esc(a.summary)}</div></div></div>`;}).join('')}</div></details>`;
  });
  const ia=(D.internalAdvantages||[]).map(x=>`<div class="row-item"><span class="tag" style="color:var(--violet)">internal</span><div><b>${esc(x.label)}</b><div class="muted" style="font-size:12.5px">${esc(x.description)}</div><div class="dim" style="font-size:11.5px;margin-top:2px">Why not a customer feature: ${esc(x.whyNotCustomerFacing)}</div></div></div>`).join('');
  return `<div class="page-head"><h2>TSP position — current vs forward</h2>
    <p>Current position is <b>live</b> capability only. Forward position (partial / in development / planned) is kept separate so it never inflates the current comparison.</p></div>
  <div class="grid g-2">
    <div><h3 style="margin-bottom:12px;color:var(--ok)">● Current (live)</h3>${cur}</div>
    <div><h3 style="margin-bottom:12px;color:var(--info)">● Forward (partial / in development / planned)</h3>${fwd}</div>
  </div>
  <div class="card" style="margin-top:22px;border-color:rgba(155,107,224,.3)">
    <h3 style="color:var(--violet)">Internal / operational advantages — NOT customer features</h3>
    <p class="muted" style="font-size:12.5px;margin:6px 0 12px">These may give TSP a commercial or operational edge, but estate agents do not receive them. They are kept out of the customer-facing comparison deliberately.</p>
    ${ia}
  </div>`;
};

  return `<div class="page-head"><h2>Gaps &amp; opportunities</h2>
    <p>Not every missing feature is a problem. Each gap is classified by strategic relevance, with the reasoning and whether TSP already has something in flight.</p></div>

        <div class="card" style="margin-bottom:12px">
          <div class="pillrow" style="margin-top:0"><b style="font-size:14.5px">${esc(x.title)}</b>${x.capabilityId?linkCapBtn(x.capabilityId):''}</div>

};

/* ======================= SOURCES ======================= */
RENDER.sources=()=>{
  const map={};

  const list=Object.values(map).sort((a,b)=>(a.ent||'').localeCompare(b.ent||''));
  const counts={FRESH:0,REVIEW_SOON:0,STALE:0}; list.forEach(s=>counts[freshness(s.date)]++);

    <div class="table-scroll"><table class="simple">
      <thead><tr><th>Entity</th><th>Source</th><th>Checked</th><th>Freshness</th></tr></thead>
      <tbody>${list.map(s=>{const fr=freshness(s.date);return `<tr>
        <td>${esc(s.ent)}</td>
        <td style="max-width:420px"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a><div class="dim" style="font-size:10.5px;word-break:break-all">${esc(s.url)}</div></td>
        <td>${esc(s.date||'—')}</td>
        <td><span class="freshdot f-${fr}"></span> ${fr.replace('_',' ').toLowerCase()}</td>
      </tr>`;}).join('')}</tbody>
    </table></div>
    <p class="footer-note">TSP's own rows cite the codebase product inventory (${esc(D.meta.tspInventorySource)}) rather than a public URL — that is our verifiable source of truth for TSP.</p>`;
};

/* ======================= notes block (editable knowledge) ======================= */
function notesBlock(type,id){
  const notes=notesFor(type,id);
  return `<div class="section"><span class="eyebrow">Internal knowledge &amp; notes</span>
    <p class="dim" style="font-size:11.5px;margin:0 0 8px">Your notes stay in this browser (localStorage) and are tagged by type so they're never confused with public evidence. Use Export to move them into the data file.</p>
    ${notes.map(n=>`<div class="note"><div class="meta"><span class="kb ${n.knowledgeType}">${n.knowledgeType}</span><span class="dim" style="font-size:11px">${esc(n.date||'')}</span></div>${esc(n.text)}</div>`).join('')||'<div class="dim" style="font-size:12px">No notes yet.</div>'}
    <div style="margin-top:10px">
      <textarea id="noteText" rows="2" placeholder="Add an internal note or private evidence…"></textarea>
      <div class="pillrow" style="margin-top:8px">
        <select id="noteType" style="width:auto"><option value="INTERNAL">Internal knowledge</option><option value="INFERENCE">Inference</option></select>
        <button class="btn" onclick="window.__addNote('${type}','${id}')">Save note</button>
        <button class="btn ghost" onclick="window.__exportNotes()">Export all notes</button>
      </div>
    </div></div>`;
}
window.__addNote=(type,id)=>{
  const t=$('#noteText').value.trim(); if(!t)return;
  const notes=loadNotes();
  notes.push({targetType:type,targetId:id,text:t,knowledgeType:$('#noteType').value,date:new Date().toISOString().slice(0,10)});
  saveNotes(notes);
  // re-render the current drawer so the new note shows immediately
  if(type==='entity') window.__ent(id);
  else if(type==='capability' && window.__lastCell) cellDrawer(window.__lastCell.entId, window.__lastCell.capId);
};
window.__exportNotes=()=>{
  const blob=new Blob([JSON.stringify(loadNotes(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='market-position-notes.json'; a.click();
};

shell();
})();
</script>
</body>
</html>
